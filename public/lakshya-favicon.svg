  <!-- L -->
  <path fill="#0B8FD8" d="M7.5 14.2h5.8v11.2H21v4.2H6c-1.4 0-2.5-1.1-2.5-2.5V16.7c0-1.4 1.1-2.5 2.5-2.5z"/>

  <!-- A -->
  <path fill="#0B8FD8" fill-rule="evenodd" d="
    M20 14.5 L28.5 29.5 H23.6 L22 25.2 H16.6 L15 29.5 H10.2 L18.4 14.5 H20 Z
    M19 19.4 L20.6 23.6 H17.4 Z
  "/>
