# Separate Lighthouse CI — manual only.
# Actions → Lighthouse → Run workflow → paste URL if needed.
name: Lighthouse

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Production (or staging) URL to audit"
        required: true
        default: "https://www.lakshyainternationaledwise.com/"
        type: string
      wait_minutes:
        description: "Minutes to wait before auditing (e.g. after deploy)"
        required: false
        default: "0"
        type: string

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deploy settle
        if: inputs.wait_minutes != '0'
        run: |
          mins="${{ inputs.wait_minutes }}"
          echo "Waiting ${mins} minute(s) before Lighthouse…"
          sleep $((mins * 60))

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        id: install-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Lighthouse CI
        env:
          LIGHTHOUSE_URL: ${{ inputs.url }}
          CHROME_PATH: ${{ steps.install-chrome.outputs.chrome-path }}
        run: |
          echo "Auditing: $LIGHTHOUSE_URL"
          npx lhci autorun
